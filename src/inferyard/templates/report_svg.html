{% if run.svg_gallery %}<div class="section-head" id="svg-{{ n }}"><div><div class="eyebrow">generative showcase</div><h2>SVG 生成展示 · 不评分</h2></div><span>{{ run.svg_gallery|length }} 项 · 原始渲染</span></div><section class="panel svg-gallery">{% for item in run.svg_gallery %}<figure class="svg-figure"><p class="svg-prompt">{{ text(item.prompt_ref) }}</p><div class="svg-stage">{% if item.svg_view.status == "ok" %}{{ svg(item.svg_view, "svg-render") }}{% else %}<p class="svg-fallback">未能提取可渲染的 SVG（{{ item.svg_view.status }}），原始输出见题目详情。</p>{% endif %}</div><figcaption><code>{{ item.case_id }}</code> · 解析 <code>{{ item.svg_view.status }}</code> · {{ item.svg_view.bytes }} bytes · 耗时 {{ item.latency_ms|milliseconds }} s · 输出 {{ item.completion_tokens|display }} tokens · <a href="#case-{{ n }}-{{ item.ordinal }}">题目详情 ↓</a></figcaption></figure>{% endfor %}<p class="panel-note">生成式题型只展示模型原始输出，不做质量评分；图像按报告 CSP 约束渲染，脚本与事件处理器不执行。</p></section>{% endif %}
