[tools]
python = "3.14.7"
uv = "0.13.1"
go = "1.27.2"

[tasks.test]
run = "cd cli && uv run --frozen pytest"

[tasks.lint]
run = "cd cli && uv run --frozen ruff check src tests scripts"

[tasks.schemas]
run = "cd cli && uv run --frozen python scripts/export_schemas.py --check"

[tasks."test:studio-ui"]
description = "Run macOS native UI e2e with the simulated Studio backend"
run = "cd studio && python tests/ui/run.py"
