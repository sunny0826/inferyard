[tools]
python = "3.15.1"
uv = "0.13.5"
go = "1.27.3"

[tasks.dev]
description = "Build and start this checkout's paired Studio and CLI"
run = "python tools/dev.py"

[tasks."dev:rebuild"]
description = "Start a fresh development profile, preserving history and downloaded assets"
run = "python tools/dev.py rebuild"

[tasks."dev:stop"]
description = "Gracefully stop only this checkout's recorded development Studio"
run = "python tools/dev.py stop"

[tasks.test]
run = "cd cli && uv run --frozen pytest"

[tasks.lint]
run = "cd cli && uv run --frozen ruff check src tests scripts"

[tasks.schemas]
run = "cd cli && uv run --frozen python scripts/export_schemas.py --check"

[tasks."test:studio-ui"]
description = "Run the daily macOS native UI checks (3 key workflows)"
run = "cd studio && python tests/ui/run.py"

[tasks."test:studio-ui:full"]
description = "Run all 12 macOS native UI workflows with the simulated Studio backend"
run = "cd studio && python tests/ui/run.py --suite full"
