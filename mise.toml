[tools]
python = "3.15.2"
uv = "0.13.6"
go = "1.27.3"

[tasks.dev]
description = "Build and start this checkout's paired Studio and CLI"
run = "python tools/dev.py"

[tasks."dev:rebuild"]
description = "Start a fresh development profile, preserving history and downloaded assets"
run = "python tools/dev.py rebuild"

[tasks."dev:stop"]
description = "Gracefully stop only this checkout's recorded development Studio"
run = "python tools/dev.py stop"

[tasks."cli:sync"]
description = "Sync locked CLI dependencies into cli/.venv"
dir = "cli"
run = "uv sync --frozen"

[tasks.test]
description = "Run full CLI test suite in parallel"
dir = "cli"
run = "uv run --frozen pytest -n auto -q"

[tasks."test:unit"]
description = "Run fast CLI unit tests"
dir = "cli"
run = "uv run --frozen pytest tests/unit -q"

[tasks."test:studio"]
description = "Run Studio Go unit tests (macOS; Windows internal/core has pre-existing permission-bit debt)"
dir = "studio"
env = { GOTOOLCHAIN = "go1.27.3", GOPROXY = "https://goproxy.cn,direct", CGO_ENABLED = "0" }
run = "go test . ./internal/... -count=1"

[tasks."test:studio:preview"]
description = "Run Studio UI debug preview Go tests (macOS)"
dir = "studio"
env = { GOTOOLCHAIN = "go1.27.3", GOPROXY = "https://goproxy.cn,direct", CGO_ENABLED = "0" }
run = "go test -tags ui_debug . ./internal/pages -count=1"

[tasks."test:studio:e2e"]
description = "Run Studio Go e2e tests (ensures CLI environment is synced first)"
depends = ["cli:sync"]
dir = "studio"
env = { GOTOOLCHAIN = "go1.27.3", GOPROXY = "https://goproxy.cn,direct", CGO_ENABLED = "0" }
run = "go test ./tests/e2e/ -count=1"

[tasks."test:studio:e2e:polystrata"]
description = "Run real-machine Studio PolyStrata e2e lifecycle using existing local assets"
depends = ["cli:sync"]
dir = "studio"
env = { GOTOOLCHAIN = "go1.27.3", GOPROXY = "https://goproxy.cn,direct", CGO_ENABLED = "0", INFERYARD_POLYSTRATA_E2E = "1" }
run = "go test -v -timeout 45m ./tests/e2e/ -run TestPolystrataRealLifecycle -count=1"

[tasks.lint]
dir = "cli"
run = "uv run --frozen ruff check src tests scripts"

[tasks.schemas]
dir = "cli"
run = "uv run --frozen python scripts/export_schemas.py --check"

[tasks."test:studio-ui"]
description = "Run the daily macOS native UI checks (3 key workflows)"
dir = "studio"
run = "python tests/ui/run.py"

[tasks."test:studio-ui:full"]
description = "Run all 7 macOS native UI workflows with the simulated Studio backend"
dir = "studio"
run = "python tests/ui/run.py --suite full"

[tasks."test:studio-ui:polystrata"]
description = "Run local-only real macOS window UI e2e with local PolyStrata assets (not run in CI)"
depends = ["cli:sync"]
dir = "studio"
run = "python tests/ui/run_polystrata.py"

[tasks.release]
description = "Fast release: bump version, open/merge release PR, push tag, and watch release CI"
run = "python tools/release.py"
