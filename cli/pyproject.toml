[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferyard"
version = "0.0.24"
description = "Cross-platform local AI benchmarking CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "psutil>=7.2,<8",
]

[project.urls]
Repository = "https://github.com/sunny0826/inferyard"
Issues = "https://github.com/sunny0826/inferyard/issues"

[project.scripts]
inferyard = "inferyard.cli:main"

[dependency-groups]
# Cross-platform test doubles import native helpers on Linux as well.
dev = [
    "pytest>=8.4,<10",
    "jsonschema>=4.25,<5",
    "psutil>=7.2,<8",
    "ruff>=0.12,<1",
    "pytest-xdist>=3.8,<4",
    "ty>=0.0.112,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferyard"]
include = [
  "src/inferyard/**/*.py",
  "src/inferyard/data/*.json",
  "src/inferyard/data/community/README.md",
  "src/inferyard/data/community/configs/*.example.toml",
  "src/inferyard/data/community/profile/*.json",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.sdist]
# Explicit build inputs only; no real device configurations, evidence, caches or model assets.
only-include = [
  "pyproject.toml", "uv.lock", "LICENSE", "README.md", ".gitignore", "hatch_build.py",
  "src/inferyard",
]
include = [
  "/pyproject.toml", "/uv.lock", "/LICENSE", "/README.md", "/.gitignore", "/hatch_build.py",
  "src/inferyard/**/*.py",
  "src/inferyard/data/*.json",
  "src/inferyard/data/community/README.md",
  "src/inferyard/data/community/configs/*.example.toml",
  "src/inferyard/data/community/profile/*.json",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
# Execution failures only; formatting, import order and syntax preferences are not gates.
# E9: syntax; F63/F7: invalid expressions/control flow; F811: accidental redefinition;
# F82: undefined names; B006/B012/B023: shared mutable defaults, swallowed exits, and
# late-bound loop closures; PLE: pylint runtime error class.
select = ["E9", "F63", "F7", "F811", "F82", "B006", "B012", "B023", "PLE"]

[tool.ty.src]
include = ["src"]
exclude = ["src/inferyard/data/**"]

[tool.ty.rules]
all = "ignore"
import-not-found = "error"
unresolved-reference = "error"
missing-argument = "error"
unknown-argument = "error"
too-many-positional-arguments = "error"
parameter-already-assigned = "error"
duplicate-base = "error"
division-by-zero = "error"
index-out-of-bounds = "error"

[[tool.ty.overrides]]
include = [
  "src/inferyard/analysis/scoring.py",
  "src/inferyard/application/memory_check.py",
  "src/inferyard/platforms/engine_fit.py",
]
[tool.ty.overrides.rules]
missing-argument = "ignore"
unknown-argument = "ignore"
too-many-positional-arguments = "ignore"
