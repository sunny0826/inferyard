[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferyard"
version = "0.0.8"
description = "Cross-platform local AI benchmarking CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15,<3.16"
dependencies = [
  "httpx>=0.28,<0.29",
  "jsonschema>=4.25,<5",
  "psutil>=7.2,<8",
]

[project.urls]
Repository = "https://github.com/sunny0826/inferyard"
Issues = "https://github.com/sunny0826/inferyard/issues"

[project.scripts]
inferyard = "inferyard.cli:main"

[dependency-groups]
# Cross-platform test doubles import native helpers on Linux as well.
dev = [
    "pytest>=8.4,<10",
    "jsonschema>=4.25,<5",
    "psutil>=7.2,<8",
    "ruff>=0.12,<1",
    "pytest-xdist>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inferyard"]
include = [
  "src/inferyard/**/*.py",
  "src/inferyard/data/*.json",
  "src/inferyard/data/community/README.md",
  "src/inferyard/data/community/configs/*.example.toml",
  "src/inferyard/data/community/bundles/*.json",
  "src/inferyard/data/community/profile/*.json",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.sdist]
# Explicit build inputs only; no real device configurations, evidence, caches or model assets.
only-include = [
  "pyproject.toml", "uv.lock", "LICENSE", "README.md", ".gitignore",
  "src/inferyard",
]
include = [
  "/pyproject.toml", "/uv.lock", "/LICENSE", "/README.md", "/.gitignore",
  "src/inferyard/**/*.py",
  "src/inferyard/data/*.json",
  "src/inferyard/data/community/README.md",
  "src/inferyard/data/community/configs/*.example.toml",
  "src/inferyard/data/community/bundles/*.json",
  "src/inferyard/data/community/profile/*.json",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
# Execution failures only; formatting, import order and syntax preferences are not gates.
# E9: syntax; F63/F7: invalid expressions/control flow; F82: undefined names;
# B006/B012/B023: shared mutable defaults, swallowed exits, and late-bound loop closures.
select = ["E9", "F63", "F7", "F82", "B006", "B012", "B023"]
