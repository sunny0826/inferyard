name: Check a fixed release candidate
description: Validate origin run, retained build, installation results and same-byte staging
inputs:
  run-id:
    required: true
    description: Successful manually dispatched package-check run in this repository
  source-commit:
    required: true
    description: Full source SHA matching this dispatch ref
  manifest-sha256:
    required: true
    description: Reviewed candidate manifest SHA256
  token:
    required: true
    description: Read-only Actions access for the source artifact
  packages-only:
    default: 'false'
    description: Stage only wheel and sdist for PyPI
runs:
  using: composite
  steps:
    - name: Bind download to the requested source and trusted workflow
      uses: actions/github-script@v8
      env:
        SOURCE_RUN: ${{ inputs.run-id }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        MANIFEST_SHA: ${{ inputs.manifest-sha256 }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { SOURCE_RUN, SOURCE_COMMIT, MANIFEST_SHA } = process.env;
          if (!/^[0-9]+$/.test(SOURCE_RUN) || !/^[0-9a-f]{40}$/.test(SOURCE_COMMIT)
              || !/^[0-9a-f]{64}$/.test(MANIFEST_SHA) || context.sha !== SOURCE_COMMIT) {
            throw new Error('Dispatch ref, source SHA or digest is invalid');
          }
          const { data: run } = await github.rest.actions.getWorkflowRun({
            ...context.repo, run_id: Number(SOURCE_RUN)
          });
          if (run.head_sha !== SOURCE_COMMIT || run.conclusion !== 'success'
              || run.event !== 'workflow_dispatch'
              || run.path !== '.github/workflows/package-check.yml'
              || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
            throw new Error('Candidate run origin does not match the reviewed source');
          }
    - uses: actions/download-artifact@v5
      with:
        name: release-candidate
        run-id: ${{ inputs.run-id }}
        repository: ${{ github.repository }}
        github-token: ${{ inputs.token }}
        path: candidate
    - name: Verify candidate snapshots and stage exact bytes
      shell: bash
      env:
        EXPECTED_MANIFEST: ${{ inputs.manifest-sha256 }}
        EXPECTED_COMMIT: ${{ inputs.source-commit }}
        PACKAGES_ONLY: ${{ inputs.packages-only }}
      run: |
        args=()
        if [ "$PACKAGES_ONLY" = true ]; then args+=(--packages-only); fi
        mise exec -- uv run --frozen python scripts/verify_release_candidate.py \
          --manifest candidate/manifest.json \
          --manifest-sha256 "$EXPECTED_MANIFEST" \
          --source-commit "$EXPECTED_COMMIT" \
          --stage approved-files "${args[@]}"
    - name: Create checksums for verified release attachments
      if: inputs.packages-only != 'true'
      shell: bash
      working-directory: approved-files
      run: |
        sha256sum -- * > ../SHA256SUMS
        mv ../SHA256SUMS .
        sha256sum --check SHA256SUMS
