name: Manually verify or publish a fixed candidate
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful manual package-check run ID in this repository
        required: true
        type: string
      manifest_sha256:
        description: Reviewed v2 CLI candidate manifest SHA256
        required: true
        type: string
      studio_run_id:
        description: Successful manual Studio release candidate run ID in this repository
        required: true
        type: string
      studio_manifest_sha256:
        description: Reviewed Studio candidate manifest SHA256
        required: true
        type: string
      source_commit:
        description: Full source SHA (select its matching dispatch ref)
        required: true
        type: string
      destination:
        description: Explicit external operation; verify-only performs no publication
        type: choice
        default: verify-only
        options: [verify-only, github-release, pypi, both]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - run: mise exec -- uv --directory cli sync --frozen
      - uses: ./.github/actions/check-release
        with:
          run-id: ${{ inputs.run_id }}
          source-commit: ${{ inputs.source_commit }}
          manifest-sha256: ${{ inputs.manifest_sha256 }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/check-studio-release
        with:
          run-id: ${{ inputs.studio_run_id }}
          source-commit: ${{ inputs.source_commit }}
          manifest-sha256: ${{ inputs.studio_manifest_sha256 }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Hand the verified CLI bytes to the publishing jobs
        if: inputs.destination != 'verify-only'
        uses: actions/upload-artifact@v7
        with:
          name: verified-cli-files
          path: approved-files
          retention-days: 1
          if-no-files-found: error
      - name: Hand the verified Studio bytes to the release job
        if: inputs.destination == 'github-release' || inputs.destination == 'both'
        uses: actions/upload-artifact@v7
        with:
          name: verified-studio-files
          path: studio-approved-files
          retention-days: 1
          if-no-files-found: error
  github-release:
    needs: verify
    if: inputs.destination == 'github-release' || inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-cli-files
          path: approved-files
      - uses: actions/download-artifact@v8
        with:
          name: verified-studio-files
          path: studio-approved-files
      - name: Refuse a release tag pointing at another source
        uses: actions/github-script@v9
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        with:
          script: |
            let ref;
            try {
              ref = (await github.rest.git.getRef({ ...context.repo, ref: 'tags/v0.0.5' })).data;
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            let object = ref.object;
            while (object.type === 'tag') {
              object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.SOURCE_COMMIT) {
              throw new Error('Release tag points at another source commit');
            }
      - name: Require all nine verified attachments before publication
        shell: bash
        run: |
          test "$(find approved-files studio-approved-files -maxdepth 1 -type f | wc -l)" -eq 9
      - name: Create a draft Release with all verified CLI and Studio bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA: ${{ inputs.manifest_sha256 }}
          SOURCE_RUN: ${{ inputs.run_id }}
          STUDIO_CANDIDATE_SHA: ${{ inputs.studio_manifest_sha256 }}
          STUDIO_SOURCE_RUN: ${{ inputs.studio_run_id }}
        run: >-
          gh release create v0.0.5 approved-files/* studio-approved-files/*
          --target "$SOURCE_COMMIT" --draft --title 'v0.0.5'
          --notes "Source $SOURCE_COMMIT; CLI candidate SHA256 $CANDIDATE_SHA (package-check run $SOURCE_RUN); Studio candidate SHA256 $STUDIO_CANDIDATE_SHA (Studio release run $STUDIO_SOURCE_RUN). Installation checks do not establish native model or performance qualification."
  pypi:
    needs: verify
    if: inputs.destination == 'pypi' || inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/inferyard
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verified-cli-files
          path: approved-files
      - name: Select the verified wheel and sdist for PyPI
        shell: bash
        run: |
          mkdir pypi-packages
          cp approved-files/*.whl approved-files/*.tar.gz pypi-packages/
          test "$(find pypi-packages -maxdepth 1 -type f | wc -l)" -eq 2
      # Maintainer setup: reserve project name, configure the pypi environment and Trusted Publisher.
      # This workflow is preparation only until explicitly dispatched for publication.
      - name: Publish verified wheel and sdist using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-packages/
          attestations: true
  pypi-smoke:
    name: PyPI install smoke (${{ matrix.os }})
    needs: pypi
    if: inputs.destination == 'pypi' || inputs.destination == 'both'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    permissions:
      contents: read
    steps:
      - name: Fetch only the mise version source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@v5.2.4
      - name: Install the published CLI and exercise its real entry points
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/inferyard-published-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/inferyard-published-bin
        run: |
          mise exec -- uv tool install --managed-python --python 3.15.2 inferyard==0.0.5
          binary="$UV_TOOL_BIN_DIR/inferyard"
          if [ "${{ matrix.os }}" = windows-2025 ]; then binary="$binary.exe"; fi
          "$binary" --help
          "$binary" --versions > versions.json
          "$binary" --schema studio_report > studio-report.schema.json
          mise exec -- python -c 'import json; data=json.load(open("versions.json")); schema=json.load(open("studio-report.schema.json")); assert data["tool_version"] == "0.0.5"; assert data["python"].startswith("3.15."); assert schema["$id"]'
          mise exec -- uvx --isolated --managed-python --python 3.15.2 inferyard==0.0.5 --help
