name: Package checks
on:
  pull_request:
    paths:
      - "cli/src/**"
      - "cli/tests/**"
      - "cli/scripts/**"
      - "cli/bundles/**"
      - "cli/configs/**"
      - "cli/schemas/**"
      - "cli/pyproject.toml"
      - "cli/uv.lock"
      - "LICENSE"
      - "mise.toml"
      - ".github/workflows/package-check.yml"
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: cli
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - run: mise exec -- uv sync --frozen
      - run: mise exec -- uv run --frozen pytest -n auto -q
      - run: mise exec -- uv run --frozen ruff check src tests scripts
      - run: mise exec -- uv run --frozen python scripts/export_schemas.py --check
