name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Also publish CLI wheel and sdist to PyPI via Trusted Publishing
        type: boolean
        default: false
      draft:
        description: Create a Draft GitHub Release instead of publishing immediately
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      allow_release: ${{ steps.version.outputs.allow_release }}
      is_tag_push: ${{ steps.version.outputs.is_tag_push }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            cli/pyproject.toml
            cli/src/inferyard/__init__.py
            studio/mygo.config.ts
          sparse-checkout-cone-mode: false
      - name: Read and validate CLI and Studio versions
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, re, tomllib
          from pathlib import Path
          cli_version = tomllib.loads(Path("cli/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", cli_version):
              raise SystemExit(f"invalid cli version (expected X.Y.Z): {cli_version}")
          init_match = re.search(r"^__version__\s*=\s*[\x27\"]([^\x27\"]+)[\x27\"]", Path("cli/src/inferyard/__init__.py").read_text(encoding="utf-8"), re.M)
          if not init_match:
              raise SystemExit("__version__ missing in cli/src/inferyard/__init__.py")
          init_version = init_match.group(1)
          match = re.search(r"^\s*version:\s*[\x27\"]([^\x27\"]+)[\x27\"]", Path("studio/mygo.config.ts").read_text(encoding="utf-8"), re.M)
          if not match:
              raise SystemExit("studio version missing in studio/mygo.config.ts")
          studio_version = match.group(1)
          if len({cli_version, init_version, studio_version}) != 1:
              raise SystemExit(f"version mismatch: cli={cli_version} init={init_version} studio={studio_version}")
          expected_tag = f"v{cli_version}"
          event_name = os.environ.get("EVENT_NAME", "")
          ref = os.environ.get("REF", "")
          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ.get("REF_NAME", "")
          if ref_type == "tag" and ref_name != expected_tag:
              raise SystemExit(f"tag mismatch: ref={ref_name} expected={expected_tag}")
          is_release_tag = ref == f"refs/tags/{expected_tag}"
          is_main_branch = ref == "refs/heads/main"
          is_tag_push = event_name == "push" and is_release_tag
          allow_release = is_tag_push or (
              event_name == "workflow_dispatch" and (is_main_branch or is_release_tag)
          )
          if event_name == "push" and not is_tag_push:
              raise SystemExit(f"unexpected push ref: {ref} expected=refs/tags/{expected_tag}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"version={cli_version}\n")
              out.write(f"tag={expected_tag}\n")
              out.write(f"allow_release={str(allow_release).lower()}\n")
              out.write(f"is_tag_push={str(is_tag_push).lower()}\n")
          '

  cli:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: go
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('cli/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: mise exec -- uv sync --frozen
      - run: mise exec -- uv run --frozen ruff check src tests scripts
      - run: mise exec -- uv run --frozen python scripts/export_schemas.py --check
      - run: mise exec -- uv run --frozen pytest -n auto -q
      - name: Build CLI wheel and sdist
        run: mise exec -- uv build --out-dir dist/cli
      - name: Smoke-test installed wheel in a clean environment
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          smoke_venv="$RUNNER_TEMP/inferyard-cli-smoke"
          mise exec -- uv venv "$smoke_venv"
          mise exec -- uv pip install --python "$smoke_venv/bin/python" dist/cli/*.whl
          "$smoke_venv/bin/inferyard" --help > /dev/null
          "$smoke_venv/bin/inferyard" --versions > "$RUNNER_TEMP/versions.json"
          "$smoke_venv/bin/inferyard" --schema studio_report > "$RUNNER_TEMP/studio_report.schema.json"
          mise exec -- python -c '
          import json, os
          from pathlib import Path
          tmp = Path(os.environ["RUNNER_TEMP"])
          versions = json.loads((tmp / "versions.json").read_text(encoding="utf-8"))
          schema = json.loads((tmp / "studio_report.schema.json").read_text(encoding="utf-8"))
          assert versions["tool_version"] == os.environ["EXPECTED_VERSION"], versions
          assert schema.get("$id"), schema
          '
      - uses: actions/upload-artifact@v7
        with:
          name: cli-dist
          path: |
            cli/dist/cli/*.whl
            cli/dist/cli/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  studio:
    name: Studio (${{ matrix.target }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      MISE_DISABLE_TOOLS: uv
    defaults:
      run:
        working-directory: studio
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: windows-amd64
          - os: ubuntu-24.04
            target: linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ hashFiles('studio/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Check release packaging and debug exclusion
        shell: bash
        run: |
          mise exec -- go test -tags ui_debug,release . -count=1
          mise exec -- python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          binary="build/$TARGET/inferyard-studio"
          if [ "$TARGET" = windows-amd64 ]; then binary="$binary.exe"; fi
          mkdir -p "$(dirname "$binary")"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-X inferyard/studio/internal/core.BuildTime=${build_time} -X inferyard/studio/internal/core.GitCommit=${SOURCE_COMMIT}"
          mise exec -- go build -tags release -ldflags "$ldflags" -o "$binary" .
      - name: Verify release binary rejects --debug-ui
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="build/$TARGET/inferyard-studio"
          if [ "$TARGET" = windows-amd64 ]; then binary="$binary.exe"; fi
          "$binary" --help > /dev/null
          set +e
          "$binary" --debug-ui > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected --debug-ui exit 2, got $status"
            exit 1
          fi
      - name: Check Windows installer compiler
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler not found: $compiler"
          }
      - name: Package Studio archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          mise exec -- python scripts/package.py
          --target "$TARGET"
          --source-commit "$SOURCE_COMMIT"
          --out "dist/studio-$TARGET"
      - name: Mount and check macOS DMG
        if: matrix.target == 'darwin-arm64'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          MOUNT_POINT: ${{ runner.temp }}/inferyard-studio-release
        run: |
          mkdir -p "$MOUNT_POINT"
          hdiutil attach \
            "dist/studio-darwin-arm64/inferyard-studio-v${VERSION}-darwin-arm64.dmg" \
            -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          test -f "$MOUNT_POINT/InferYard Studio.app/Contents/Resources/AppIcon.icns"
          test -f "$MOUNT_POINT/InferYard Studio.app/Contents/Resources/LICENSE"
          mise exec -- python -c '
          import os
          from pathlib import Path
          entries = sorted(p.name for p in Path(os.environ["MOUNT_POINT"]).iterdir() if not p.name.startswith("."))
          assert entries == ["Applications", "InferYard Studio.app"], entries
          '
          binary="$MOUNT_POINT/InferYard Studio.app/Contents/MacOS/inferyard-studio"
          "$binary" --help > /dev/null
          set +e
          "$binary" --debug-ui > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected DMG --debug-ui exit 2, got $status"
            exit 1
          fi
      - name: Detach macOS DMG
        if: ${{ always() && matrix.target == 'darwin-arm64' }}
        shell: bash
        run: |
          if hdiutil info | grep -Fq "$RUNNER_TEMP/inferyard-studio-release"; then
            hdiutil detach "$RUNNER_TEMP/inferyard-studio-release"
          fi
      - name: Install and check Windows installer
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = (Resolve-Path "dist/studio-windows-amd64/inferyard-studio-v$($env:VERSION)-windows-amd64.exe").Path
          $install = Join-Path $env:RUNNER_TEMP 'inferyard-studio-install'
          $result = Start-Process -FilePath $installer -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`""
          ) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exit code: $($result.ExitCode)" }
          $binary = Join-Path $install 'inferyard-studio.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Installed executable is missing' }
          & $binary --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Installed --help exit code: $LASTEXITCODE" }
          & $binary --debug-ui *> $null
          if ($LASTEXITCODE -ne 2) { throw "Installed --debug-ui exit code: $LASTEXITCODE" }
          $uninstaller = Join-Path $install 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller is missing' }
          $result = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exit code: $($result.ExitCode)" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path -LiteralPath $install) -and ([DateTime]::UtcNow -lt $deadline)) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $install) { throw 'Uninstall did not remove the application directory within 30 seconds' }
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: studio-dist-${{ matrix.target }}
          path: |
            studio/dist/studio-${{ matrix.target }}/inferyard-studio-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.dmg
            studio/dist/studio-${{ matrix.target }}/inferyard-studio-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.exe
            studio/dist/studio-${{ matrix.target }}/inferyard-studio-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  github-release:
    needs: [metadata, cli, studio]
    if: needs.metadata.outputs.allow_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            cli/CHANGELOG.md
            tools/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: cli-dist
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: studio-dist-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS and verify artifact set
        shell: bash
        run: |
          python3 -c '
          import hashlib
          from pathlib import Path
          root = Path("release-assets")
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != "SHA256SUMS")
          if len(files) != 5:
              raise SystemExit(f"expected 5 release assets, got {[p.name for p in files]}")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files]
          (root / "SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          '
      - name: Refuse a release tag pointing at another source commit
        uses: actions/github-script@v9
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        with:
          script: |
            let ref;
            try {
              ref = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${process.env.TAG}` })).data;
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            let object = ref.object;
            while (object.type === 'tag') {
              object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            }
            if (object.type !== 'commit' || object.sha !== process.env.SOURCE_COMMIT) {
              throw new Error(`Release tag ${process.env.TAG} points at another commit (${object.sha})`);
            }
      - name: Build release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$SOURCE_COMMIT" \
            --jq .body > generated-notes.md
          python3 tools/release_notes.py \
            --version "$VERSION" \
            --changelog cli/CHANGELOG.md \
            --generated generated-notes.md \
            --out release-notes.md
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}
        run: |
          while IFS=$'\t' read -r rel_id rel_tag rel_draft; do
            if [ "$rel_tag" = "$TAG" ]; then
              if [ "$rel_draft" = "false" ]; then
                echo "Published release for $TAG already exists (id=$rel_id); refusing to overwrite."
                exit 1
              fi
              echo "Removing stale draft release $rel_id for $TAG before re-creating..."
              gh api -X DELETE "repos/$GH_REPO/releases/$rel_id"
            fi
          done < <(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.id, .tag_name, .draft] | @tsv')

          args=(
            release create "$TAG" release-assets/*
            --target "$SOURCE_COMMIT"
            --title "$TAG"
            --notes-file release-notes.md
          )
          if [ "$IS_DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          gh "${args[@]}"

  pypi:
    needs: [metadata, cli, github-release]
    if: >-
      needs.metadata.outputs.allow_release == 'true' &&
      (needs.metadata.outputs.is_tag_push == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true && inputs.draft != true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/inferyard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-dist
          path: pypi-packages
      - name: Publish CLI wheel and sdist using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-packages/
          attestations: true
