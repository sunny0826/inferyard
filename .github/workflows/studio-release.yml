name: Studio release candidate
on:
  pull_request:
    paths:
      - "studio/**"
      - "!studio/README.md"
      - "!studio/docs/**"
      - "cli/schemas/**"
      - "cli/src/inferyard/reporting/**"
      - "cli/src/inferyard/contracts/**"
      - "cli/pyproject.toml"
      - "cli/uv.lock"
      - "LICENSE"
      - "mise.toml"
      - ".github/workflows/studio-release.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
defaults:
  run:
    working-directory: studio
jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: windows-amd64
          - os: ubuntu-24.04
            target: linux-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Sync the CLI used by the production UI smoke
        if: matrix.target == 'darwin-arm64'
        working-directory: cli
        run: mise exec -- uv sync --frozen
      - name: Check release packaging and debug exclusion
        shell: bash
        run: |
          mise exec -- go test -tags ui_debug,release . -count=1
          mise exec -- python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the native release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="build/$TARGET/inferyard-studio"
          if [ "$TARGET" = windows-amd64 ]; then binary="$binary.exe"; fi
          mkdir -p "$(dirname "$binary")" build/release-evidence
          mise exec -- env GOTOOLCHAIN=go1.27.3 GOPROXY=https://goproxy.cn,direct CGO_ENABLED=0 \
            go build -tags release -o "$binary" .
      - name: Check the packaged command boundary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="build/$TARGET/inferyard-studio"
          if [ "$TARGET" = windows-amd64 ]; then binary="$binary.exe"; fi
          "$binary" --help >"build/release-evidence/$TARGET-help.txt" 2>&1
          set +e
          "$binary" --debug-ui >"build/release-evidence/$TARGET-debug-ui.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            cat "build/release-evidence/$TARGET-debug-ui.txt"
            echo "Expected --debug-ui exit 2, got $status"
            exit 1
          fi
      - name: Check the Windows installer compiler
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler not found: $compiler"
          }
      - name: Package the native candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          mise exec -- python scripts/package.py
          --target "$TARGET"
          --source-commit "$SOURCE_COMMIT"
          --out "dist/studio-package-$TARGET"
      - name: Mount and check the macOS disk image
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          mount_point="$RUNNER_TEMP/inferyard-studio-release"
          mkdir -p "$mount_point"
          hdiutil attach \
            dist/studio-package-darwin-arm64/inferyard-studio-v0.0.5-darwin-arm64.dmg \
            -readonly -nobrowse -mountpoint "$mount_point"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = "/Applications"
          binary="$mount_point/InferYard Studio.app/Contents/MacOS/inferyard-studio"
          "$binary" --help >"build/release-evidence/darwin-arm64-dmg-help.txt" 2>&1
          set +e
          "$binary" --debug-ui >"build/release-evidence/darwin-arm64-dmg-debug-ui.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            cat "build/release-evidence/darwin-arm64-dmg-debug-ui.txt"
            echo "Expected DMG --debug-ui exit 2, got $status"
            exit 1
          fi
      - name: Install and check the Windows installer
        if: matrix.target == 'windows-amd64'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $installer = (Resolve-Path 'dist/studio-package-windows-amd64/inferyard-studio-v0.0.5-windows-amd64.exe').Path
          $install = Join-Path $env:RUNNER_TEMP 'inferyard-studio-install'
          $evidence = (Resolve-Path 'build/release-evidence').Path
          $result = Start-Process -FilePath $installer -ArgumentList @(
            '/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=`"$install`"", "/LOG=`"$evidence\windows-amd64-install.log`""
          ) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exit code: $($result.ExitCode)" }
          $binary = Join-Path $install 'inferyard-studio.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Installed executable is missing' }
          & $binary --help *> "$evidence/windows-amd64-installer-help.txt"
          if ($LASTEXITCODE -ne 0) { throw "Installed --help exit code: $LASTEXITCODE" }
          & $binary --debug-ui *> "$evidence/windows-amd64-installer-debug-ui.txt"
          if ($LASTEXITCODE -ne 2) { throw "Installed --debug-ui exit code: $LASTEXITCODE" }
          $uninstaller = Join-Path $install 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller is missing' }
          $result = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/LOG=`"$evidence\windows-amd64-uninstall.log`""
          ) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exit code: $($result.ExitCode)" }
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while ((Test-Path -LiteralPath $install) -and ([DateTime]::UtcNow -lt $deadline)) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path -LiteralPath $install) { throw 'Uninstall did not remove the application directory within 30 seconds' }
          exit 0
      - name: Produce a real CLI and fake-engine report for production UI smoke
        if: matrix.target == 'darwin-arm64'
        env:
          INFERYARD_E2E_ROOT: ${{ runner.temp }}/studio-release-e2e
        run: >-
          mise exec -- go test ./tests/e2e/
          -run '^TestChainBindRunReport$' -count=1 -timeout 900s -v
      - name: Exercise the packaged production app without debug UI
        if: matrix.target == 'darwin-arm64'
        env:
          INFERYARD_E2E_ROOT: ${{ runner.temp }}/studio-release-e2e
          RELEASE_APP: ${{ runner.temp }}/inferyard-studio-release/InferYard Studio.app
        run: >-
          mise exec -- python tests/ui/run_release.py
          --app "$RELEASE_APP"
          --e2e-root "$INFERYARD_E2E_ROOT"
          --cli "$GITHUB_WORKSPACE/cli/.venv/bin/inferyard"
          --output-root build/release-ui-e2e
      - name: Detach the macOS disk image
        if: ${{ always() && matrix.target == 'darwin-arm64' }}
        shell: bash
        run: |
          if hdiutil info | grep -Fq "$RUNNER_TEMP/inferyard-studio-release"; then
            hdiutil detach "$RUNNER_TEMP/inferyard-studio-release"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: studio-package-${{ matrix.target }}
          path: studio/dist/studio-package-${{ matrix.target }}
          if-no-files-found: error
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-command-evidence-${{ matrix.target }}
          path: studio/build/release-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Upload production UI smoke evidence
        if: ${{ always() && matrix.target == 'darwin-arm64' }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-production-ui-evidence
          path: |
            studio/build/release-ui-e2e/run-*/run.json
            studio/build/release-ui-e2e/run-*/xcodebuild.log
            studio/build/release-ui-e2e/run-*/Results.xcresult
            ${{ runner.temp }}/studio-release-e2e/transcript/**
            ${{ runner.temp }}/studio-release-e2e/workspace/reports/*/studio.json
          if-no-files-found: warn
          retention-days: 7
  candidate:
    name: Assemble and verify the Studio candidate
    needs: package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - uses: actions/download-artifact@v8
        with:
          pattern: studio-package-*
          path: studio/dist/inputs
      - name: Prepare the three-platform candidate
        id: prepare
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mise exec -- python scripts/prepare_release_candidate.py \
            --input dist/inputs/studio-package-darwin-arm64 \
            --input dist/inputs/studio-package-linux-amd64 \
            --input dist/inputs/studio-package-windows-amd64 \
            --source-commit "$SOURCE_COMMIT" \
            --out dist/studio-release-candidate
          digest=$(mise exec -- python -c 'import hashlib; print(hashlib.sha256(open("dist/studio-release-candidate/studio-release-manifest.json", "rb").read()).hexdigest())')
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "Studio candidate manifest SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: studio-release-candidate
          path: studio/dist/studio-release-candidate
          if-no-files-found: error
