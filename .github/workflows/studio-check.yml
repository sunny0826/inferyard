name: Studio checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "!studio/README.md"
      - "tools/**"
      - "cli/schemas/**"
      - "mise.toml"
      - ".github/workflows/studio-check.yml"
  pull_request:
    paths:
      - "studio/**"
      - "!studio/README.md"
      - "tools/**"
      - "cli/schemas/**"
      - "mise.toml"
      - ".github/workflows/studio-check.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CGO_ENABLED: "0"
jobs:
  unit:
    name: studio lint & build (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_DISABLE_TOOLS: uv
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Check incremental 500-line file cap
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [ -n "$base_sha" ]; then
            git cat-file -e "${base_sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base_sha"
            python3 tools/check_file_length.py --base "$base_sha"
          fi
      - uses: jdx/mise-action@v5.2.4
      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('studio/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - name: Go vet, i18n parity, and release boundary checks
        working-directory: studio
        run: |
          mise exec -- go vet ./...
          mise exec -- go test ./internal/l10n -count=1
          mise exec -- go test -tags ui_debug,release . -count=1
      - name: Compile test suites and ui_debug preview (no execution)
        working-directory: studio
        run: |
          mise exec -- go test -run '^$' . ./internal/...
          mise exec -- go test -tags ui_debug -run '^$' . ./internal/pages
          mise exec -- go test -c ./tests/e2e -o /dev/null
      - name: Cross-compile all release targets
        working-directory: studio
        shell: bash
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "Building $goos/$goarch (default and release)..."
            GOOS="$goos" GOARCH="$goarch" mise exec -- go build -o /dev/null .
            GOOS="$goos" GOARCH="$goarch" mise exec -- go build -tags release -o /dev/null .
          done
