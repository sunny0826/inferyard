name: Studio checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "studio/**"
      - "tools/**"
      - "cli/src/**"
      - "cli/schemas/**"
      - "cli/pyproject.toml"
      - "cli/uv.lock"
      - "mise.toml"
      - ".github/workflows/studio-check.yml"
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
jobs:
  test:
    name: studio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
      - name: Sync CLI dependencies (e2e drives the real CLI)
        working-directory: cli
        run: mise exec -- uv sync --frozen
      - name: Development launcher checks
        run: mise exec -- python -m unittest discover -s tools/tests -v
      - name: Development launcher lint
        working-directory: cli
        run: mise exec -- uv run --frozen ruff check ../tools --config pyproject.toml
      - name: Vet
        working-directory: studio
        run: mise exec -- go vet ./...
      # Unit tests run on macOS only: the pre-existing internal/core suite is
      # not Windows-clean yet (permission-bit, path-separator and timing
      # assumptions); that debt is tracked separately from this workflow.
      - name: Unit tests
        if: matrix.os == 'macos-15'
        working-directory: studio
        run: mise exec -- go test . ./internal/... -count=1
      - name: UI preview and release boundary
        if: matrix.os == 'macos-15'
        working-directory: studio
        run: |
          mise exec -- go vet -tags ui_debug ./...
          mise exec -- go test -tags ui_debug . ./internal/pages -count=1
          mise exec -- go test -tags ui_debug,release . -count=1
          mise exec -- go test -tags studio_dev . ./internal/core ./internal/pages -count=1
          mise exec -- go test -tags studio_dev,release . -count=1
          mise exec -- python -m unittest discover -s scripts -p test_package.py
      - name: e2e (fake engine, recorded CLI boundary)
        working-directory: studio
        run: mise exec -- go test ./tests/e2e/ -count=1 -timeout 900s -v
  native-ui:
    name: native preview UI (macOS)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.3
      - name: Native UI runner checks
        working-directory: studio
        run: mise exec -- python -m unittest discover -s tests/ui -p test_run.py
      - name: Full native preview UI e2e
        run: mise run test:studio-ui:full
      - name: Upload native UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-native-ui-results
          path: |
            studio/build/ui-e2e/run-*/run.json
            studio/build/ui-e2e/run-*/xcodebuild.log
            studio/build/ui-e2e/run-*/Results.xcresult
          if-no-files-found: ignore
          retention-days: 7
