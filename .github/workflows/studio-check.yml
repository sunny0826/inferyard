name: Studio checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "!studio/README.md"
      - "tools/**"
      - "cli/src/**"
      - "cli/schemas/**"
      - "cli/pyproject.toml"
      - "cli/uv.lock"
      - "mise.toml"
      - ".github/workflows/studio-check.yml"
  pull_request:
    paths:
      - "studio/**"
      - "!studio/README.md"
      - "tools/**"
      - "cli/src/**"
      - "cli/schemas/**"
      - "cli/pyproject.toml"
      - "cli/uv.lock"
      - "mise.toml"
      - ".github/workflows/studio-check.yml"
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
jobs:
  unit:
    name: studio unit (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Unit tests
        working-directory: studio
        run: mise exec -- go test . ./internal/... -count=1
      - name: UI preview and release boundary
        working-directory: studio
        run: |
          mise exec -- go test -tags ui_debug . ./internal/pages -count=1
          mise exec -- go test -tags ui_debug,release . -count=1
          mise exec -- python -m unittest discover -s scripts -p test_package.py
          mise exec -- python -m unittest discover -s ../tools -p 'test_*.py'
  e2e:
    name: studio e2e (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Sync CLI dependencies (e2e drives the real CLI)
        working-directory: cli
        run: mise exec -- uv sync --frozen
      - name: e2e (fake engine, recorded CLI boundary)
        working-directory: studio
        run: mise exec -- go test ./tests/e2e/ -count=1 -timeout 900s -v
  native-ui:
    name: native preview UI (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.4
      - name: Native UI runner checks
        working-directory: studio
        run: mise exec -- python -m unittest discover -s tests/ui -p 'test_*.py'
      - name: Native preview UI e2e
        run: >-
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mise run test:studio-ui:full
          else
            mise run test:studio-ui
          fi
      - name: Upload native UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-native-ui-results
          path: |
            studio/build/ui-e2e/run-*/run.json
            studio/build/ui-e2e/run-*/xcodebuild.log
            studio/build/ui-e2e/run-*/Results.xcresult
          if-no-files-found: ignore
          retention-days: 7
